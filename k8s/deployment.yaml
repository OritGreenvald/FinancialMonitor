apiVersion: apps/v1
kind: Deployment
metadata:
  name: financialmonitor-api
spec:
  replicas: 5

  selector:
    matchLabels:
      app: financialmonitor-api

  template:
    metadata:
      labels:
        app: financialmonitor-api

    spec:
      containers:
        - name: financialmonitor-api
          image: financialmonitor-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
